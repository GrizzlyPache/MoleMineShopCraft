let s={coins:0,speed:1,tab:'work',sound:true,newBook:false,bump:null,pop:null,popM:null,cust:null,last:'',people:[],served:0,sel2:null,recent:[],ring:0,disc:{},bp:0,made:{},book:{},tiers:1,envoy:null,mon:null,minis:[],rep:0,tut:0,tutG:{},sinceM:0,seenEl:{},music:true,pending:[],forceM:false,mast:{},seals:0,runs:0,mine:mk()};

const KW={Espada:/melladas|desarmados|defendernos|acero/gi,Casco:/cabezas?/gi,Botas:/pies|suelas/gi,'Pantalón':/piernas|cintura para abajo/gi,Pechera:/pecho|torso/gi,Escudo:/cubrirnos|ocultarnos/gi,Anillo:/dedo|unión/gi,Collar:/cuello|garganta|pecho/gi,Pendientes:/orejas|rostro/gi,Vidrio:/transparente|claro|luz/gi,Cetro:/vara|báculo|piedra en la punta/gi,Corona:/frente|cabeza/gi};
function blip(p,ch){
  if(!s.sound)return;
  try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume&&ac.resume().catch(()=>{})}catch(e){return}
  const c=ch.toLowerCase(),v='aeiouáéíóú'.includes(c),t0=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();
  const f=p.vf*(v?1.22:1)*(1+(c.charCodeAt(0)%7)*.055)*(.96+Math.random()*.08);
  o.type=p.vt;o.frequency.setValueAtTime(f,t0);o.frequency.exponentialRampToValueAtTime(f*(p.vg||1),t0+.07);
  const vol=(p.vt==='square'||p.vt==='sawtooth'?.11:.2)*(v?1:.8);
  g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.001,t0+.09);
  o.connect(g);g.connect(ac.destination);o.start(t0);o.stop(t0+.1);
}

// ---- sonido ----

let ac=null,lastClk=0;
function snd(n,pm){
  if(!s.sound)return;
  if(n==='click'){const q=performance.now();if(q-lastClk<90)return;lastClk=q}
  try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume&&ac.resume().catch(()=>{})}catch(e){return}
  (SND[n]||[]).forEach(([f,at,d,ty,v])=>{const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+at;
    o.type=ty;o.frequency.value=f*(pm||1);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+.02)});
}

function batchMax(){const m=M(),l=m.last;if(!l)return 0;let n=Infinity;for(const[k,c]of Object.entries(l.cost))n=Math.min(n,Math.floor(m.stock[k]/c));return n===Infinity?0:n}
function startBatch(){

function batchTick(dt){
  const m=M(),b=m.batch;if(!b)return;
  b.t+=dt;const bi=fIntFor(m.lv.forge);
  for(let g=0;g<60&&b.t>=bi;g++){
    b.t-=bi;const l=m.last;
    if(!Object.entries(l.cost).every(([k,c])=>m.stock[k]>=c))b.left=0;
    else{
      Object.entries(l.cost).forEach(([k,c])=>m.stock[k]-=c);
      if(l.r==='Lingote'){m.stock['ing@'+l.id]++;m.seen['ing@'+l.id]=1}else addMade(l.r,l.id,l.el);
      unlock(l.r);b.left--;b.done++;

      snd('place',1+Math.min(b.done,30)*.025);

function rollSpawn(){
  const m=M(),kinds=[];MIDS.slice(0,s.tiers).forEach(id=>{kinds.push(['nug',id]);kinds.push(['gem',id])});
  const k=Math.min(1+m.lv.vein,kinds.length),got=[],cat=Math.random()<.8?'nug':'gem',first=pick(kinds.filter(x=>x[0]===cat));got.push(first);
  let pool=kinds.filter(x=>x!==first);while(got.length<k&&pool.length){const x=pick(pool);got.push(x);pool=pool.filter(y=>y!==x)}
  return{got,n:Math.random()<m.lv.dup*.1?2:1};
}
function offline(sec){
  const m=M(),iv=INT(m.lv.spd),n=Math.floor(sec*.5/iv);if(n<1)return;
  const sim=Math.min(n,2500),mult=n/sim,add={};
  for(let i=0;i<sim;i++){const r=rollSpawn();r.got.forEach(([k,id])=>{const key=k+'@'+id;add[key]=(add[key]||0)+r.n})}
  let tot=0;Object.entries(add).forEach(([k,v])=>{const q=Math.round(v*mult);m.stock[k]+=q;tot+=q});
  render();toast('🌙 Mientras no estabas, la mina produjo '+fmt(tot)+' materiales (hasta 4 h, al 50%)');
}

let mus=null;
const MSCALE={mont:[0,2,3,5,7,9,10],mar:[0,2,4,5,7,9,11],jun:[0,2,4,7,9,11,12],vol:[0,1,3,5,7,8,10]},MROOT={mont:146.83,mar:164.81,jun:196,vol:130.81};
function note(f,t,d,type,vol,dest){const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+Math.min(.08,d*.2));g.gain.exponentialRampToValueAtTime(.0008,t+d);o.connect(g);g.connect(dest);o.start(t);o.stop(t+d+.05)}
function startMusic(){
  if(mus||!s.music||document.hidden)return;
  try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume&&ac.resume().catch(()=>{})}catch(e){return}
  const master=ac.createGain();master.gain.setValueAtTime(0,ac.currentTime);master.gain.linearRampToValueAtTime(.16,ac.currentTime+3);master.connect(ac.destination);
  const dl=ac.createDelay(1.5);dl.delayTime.value=.42;const fb=ac.createGain();fb.gain.value=.38;dl.connect(fb);fb.connect(dl);
  const wet=ac.createGain();wet.gain.value=.5;dl.connect(wet);wet.connect(master);
  const bus=ac.createGain();bus.connect(master);bus.connect(dl);
  mus={master,bus,step:0,next:ac.currentTime+.3,timer:setInterval(musicSched,200)};
}
function stopMusic(){
  if(!mus)return;const m=mus;mus=null;clearInterval(m.timer);
  try{m.master.gain.cancelScheduledValues(ac.currentTime);m.master.gain.setValueAtTime(m.master.gain.value,ac.currentTime);m.master.gain.linearRampToValueAtTime(0,ac.currentTime+.6);setTimeout(()=>{try{m.master.disconnect()}catch(e){}},900)}catch(e){}
}
function musicSched(){
  if(!mus)return;
  const zone=MIDS[Math.min(s.tiers,4)-1],root=MROOT[zone],sc=MSCALE[zone],sp=60/68/2;
  const prog=[[0,2,4],[5,0,2],[3,5,0],[4,6,1]],arp=[0,1,2,1,0,2,1,2];
  const fq=d=>root*Math.pow(2,(sc[((d%7)+7)%7]+12*Math.floor(d/7))/12);
  while(mus.next<ac.currentTime+1.2){
    const st=mus.step,pos=st%8,ch=prog[Math.floor(st/8)%4],t=mus.next;
    if(pos===0){ch.forEach((d,i)=>note(fq(d),t,sp*7.8,i?'triangle':'sine',.07,mus.bus));note(fq(ch[0]-7)/2,t,sp*8,'sine',.16,mus.bus)}
    if(Math.random()<.78)note(fq(ch[arp[pos]]+7),t,sp*3.2,'triangle',.11,mus.bus);
    if((pos===0&&Math.random()<.6)||(pos===4&&Math.random()<.45))note(fq(ch[Math.floor(Math.random()*3)]+14+(Math.random()<.3?1:0)),t+(Math.random()<.5?0:sp),sp*4,'sine',.08,mus.bus);
    mus.next+=sp;mus.step++;
  }
}
$('music').onclick=()=>{s.music=!s.music;$('music').classList.toggle('off',!s.music);if(s.music)startMusic();else stopMusic()};

function placeTut(box,targets){
  const vw=innerWidth,vh=innerHeight,bw=box.offsetWidth,bh=box.offsetHeight,g=6;
  const cand=[[78,46],[vw-bw-g,46],[78,vh-bh-g],[vw-bw-g,vh-bh-g],[(vw-bw)/2,46],[(vw-bw)/2,vh-bh-g]];
  const prot=[...document.querySelectorAll('button,.it,.cell,.chip,.bub,.who,.av')].filter(e=>!box.contains(e)&&e.offsetParent!==null).map(e=>e.getBoundingClientRect());
  const hl=targets.map(e=>e.getBoundingClientRect());
  const ov=(a,b)=>Math.max(0,Math.min(a.r,b.right)-Math.max(a.l,b.left))*Math.max(0,Math.min(a.b,b.bottom)-Math.max(a.t,b.top));
  let best=cand[0],bs=1e18;
  cand.forEach(([x,y])=>{const a={l:x,t:y,r:x+bw,b:y+bh};let sc=0;hl.forEach(h=>sc+=ov(a,h)*1000);prot.forEach(h=>sc+=ov(a,h));if(sc<bs){bs=sc;best=[x,y]}});
  box.style.left=Math.max(4,best[0])+'px';box.style.top=Math.max(4,best[1])+'px';
}

let drag=null;
const listen=()=>{window.addEventListener('pointermove',move);window.addEventListener('pointerup',end,{once:true})};
function paintAt(x,y,k){
  const m=M(),el=document.elementFromPoint(x,y),c=el&&el.closest('.cell');
  if(!c||!m.stock[k])return false;
  const i=+c.dataset.i;if(m.cells[i])return false;
  m.stock[k]--;m.cells[i]=k;m.ghost=false;s.pop=i;snd('place');
  if(!m.stock[k]&&m.sel===k)m.sel=null;
  render();return true;
}
function start(e,k,from){
  const m=M();if(from===null&&!m.stock[k])return;
  e.preventDefault();try{e.target.releasePointerCapture(e.pointerId)}catch(_){}
  drag={k,from,x:e.clientX,y:e.clientY,moved:false,ghost:null,paint:false};listen();
}
$('stock').addEventListener('pointerdown',e=>{const t=e.target.closest('.it');if(t&&t.dataset.k)start(e,t.dataset.k,null)});
$('table').addEventListener('pointerdown',e=>{
  const m=M(),c=e.target.closest('.cell');if(!c)return;
  const i=+c.dataset.i,k=m.cells[i];
  if(k){start(e,k,i);return}
  if(m.sel&&m.stock[m.sel]){
    e.preventDefault();
    if(paintAt(e.clientX,e.clientY,m.sel)){drag={k:m.sel,from:null,moved:true,ghost:null,paint:true};listen()}
  }
});
function move(e){
  if(!drag)return;const m=M();
  if(!drag.moved&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>6){
    drag.moved=true;
    if(drag.from!==null){m.cells[drag.from]=null;m.ghost=false;render()}
    const g=document.createElement('div');g.className='ghost';g.innerHTML=glyph(drag.k);document.body.appendChild(g);drag.ghost=g;
  }
  if(drag.ghost){drag.ghost.style.left=e.clientX+'px';drag.ghost.style.top=e.clientY+'px'}
  if(drag.moved&&drag.from===null)paintAt(e.clientX,e.clientY,drag.k);
}
function end(e){
  window.removeEventListener('pointermove',move);
  const d=drag,m=M();drag=null;if(!d)return;
  if(d.ghost)d.ghost.remove();
  if(d.paint)return;
  if(d.from!==null)m.ghost=false;
  if(!d.moved){
    if(d.from!==null){m.cells[d.from]=null;m.stock[d.k]++}else m.sel=m.sel===d.k?null:d.k;
    render();return;
  }
  if(d.from===null){render();return}
  const el=document.elementFromPoint(e.clientX,e.clientY),cell=el&&el.closest('.cell'),to=cell?+cell.dataset.i:-1;
  if(to>=0&&!m.cells[to]){m.cells[to]=d.k;s.pop=to;snd('place')}
  else if(cell)m.cells[d.from]=d.k;
  else m.stock[d.k]++;
  render();
}

// ---- crafteo por forma ----
function layout(m){
  const pts=[];m.cells.forEach((k,i)=>{if(k&&!k.startsWith('stn@'))pts.push([Math.floor(i/C),i%C,k.split('@')[0]])});
  if(!pts.length)return null;
  const r0=Math.min(...pts.map(p=>p[0])),c0=Math.min(...pts.map(p=>p[1]));
  return pts.map(p=>`${p[0]-r0},${p[1]-c0}:${p[2]}`).sort().join('|');
}
const patKey=rows=>{const o=[];rows.forEach((row,r)=>[...row].forEach((ch,c)=>{if(CODE[ch])o.push(`${r},${c}:${CODE[ch]}`)}));return o.sort().join('|')};
function craftCore(){
  const m=M(),all=m.cells.filter(Boolean),stones=all.filter(k=>k.startsWith('stn@')),ks=all.filter(k=>!k.startsWith('stn@'));
  if(!all.length){say('Coloca ingredientes en la mesa.','bad');snd('bad');return}
  if(!ks.length){say('Falta el material base: una piedra sola no forja nada.','bad');snd('bad');return}
  if(stones.length>1){say('Solo puedes usar una piedra elemental a la vez.','bad');snd('bad');return}
  const tiers=[...new Set(ks.map(k=>k.split('@')[1]))];
  if(tiers.length>1){say('No mezcles materiales de distintas zonas.','bad');snd('bad');return}
  const id=tiers[0],key=layout(m),r=RECIPES.find(r=>r.pats.some(p=>patKey(p)===key));
  if(!r){say('Esa figura no forja nada. Prueba otra combinación.','bad');snd('bad');return}
  const el=stones.length?stones[0].split('@')[1]:null;
  if(el&&!ENCH.includes(r.name)){say('La piedra '+EL[el].of+' no encaja con '+r.name+'. Solo armas y armaduras.','bad');snd('bad');return}
  const cost={},lay={};all.forEach(k=>cost[k]=(cost[k]||0)+1);m.cells.forEach((k,i)=>{if(k)lay[i]=k});
  m.last={r:r.name,id,el,cost,layout:lay};m.ghost=true;
  m.cells=Array(N).fill(null);
  if(r.stock){m.stock['ing@'+id]++;m.seen['ing@'+id]=1;s.bump=new Set(['ing@'+id])}else addMade(r.name,id,el);
  const nw=unlock(r.name),full=r.stock?r.name+' de '+MN[id].metal:mname(r.name+'@'+id+(el?':'+el:''));
  fx(id,r.stock?r.name:full,(ICON[r.name]||'')+(el?EL[el].ic:''));
  say('¡Forjado: '+full+'!'+(el?' ✨':'')+(nw?' Receta anotada en el libro.':'')+' Pulsa Craftear para repetir.','ok');render();
}
function repeatCraft(){
  const m=M(),l=m.last;
  if(!Object.entries(l.cost).every(([k,c])=>m.stock[k]>=c)){say('Faltan materiales para repetir '+l.r+'.','bad');snd('bad');holdStop();return}
  Object.entries(l.layout).forEach(([i,k])=>{m.cells[+i]=k;m.stock[k]--});
  s.popAll=true;m.rep=true;snd('place');render();
  setTimeout(()=>{m.rep=false;craftCore()},Math.max(70,230*fk()));
}
function craft(){
  const m=M();
  if(m.rep)return;
  if(!m.cells.some(Boolean)){
    if(m.ghost&&m.last&&m.last.layout)return repeatCraft();
    say('Coloca ingredientes: toca un material y luego una casilla (o arrástralo).','bad');snd('bad');return;
  }
  craftCore();
}

function startJob(n,msg){
  const m=M();if(m.job)return false;

  const id=unlocked(m.autoTier)?m.autoTier:'mont',need={};
  plan.forEach(([,r])=>{const k=r+'@'+id;need[k]=(need[k]||0)+1});
  if(Object.entries(need).every(([k,v])=>m.stock[k]>=v)){m.job={n,id,plan,i:0,pend:0,t:.6,w:0};return true}
  if(msg){say('Faltan materiales de '+MN[id].metal+' para '+n+'.','bad');snd('bad')}

function jobTick(dt){

  m.cells=Array(N).fill(null);addMade(j.n,j.id);unlock(j.n);m.job=null;fx(j.id,dn(j.n,j.id),ICON[j.n]);say('¡Forjado: '+mname(j.n+'@'+j.id)+'!','ok');render();
}

  };
  if(j.a===0){j.a=1;launch(0)}
  else if(j.a===1&&j.t>=.5*fk()){j.a=2;launch(1)}
  else if(j.a===2&&j.t>=1.2*fk()){j.a=3;q.mc=['ing@'+id,null];s.popM=id+0;snd('rare');render()}
  else if(j.a===3&&j.t>=1.7*fk()){q.mc=[null,null];m.stock['ing@'+id]++;m.seen['ing@'+id]=1;s.bump=new Set(['ing@'+id]);unlock('Lingote');q.mj=null;render()}
}

// ---- generación ----
function spawn(){
  const m=M(),kinds=[];
  MIDS.slice(0,s.tiers).forEach(id=>{kinds.push(['nug',id]);kinds.push(['gem',id])});
  const k=Math.min(1+m.lv.vein,kinds.length),got=[];
  const cat=Math.random()<.8?'nug':'gem',first=pick(kinds.filter(x=>x[0]===cat));got.push(first);
  let pool=kinds.filter(x=>x!==first);
  while(got.length<k&&pool.length){const x=pick(pool);got.push(x);pool=pool.filter(y=>y!==x)}
  const dup=Math.random()<m.lv.dup*.1,n=dup?2:1;
  s.bump=new Set();
  got.forEach(([r,id])=>{
    const key=r+'@'+id;m.stock[key]+=n;s.bump.add(key);
    if(s.tab==='work'){const tl=document.querySelector('.stock .it[data-k="'+key+'"] .g');if(tl){const[x,y]=ctr(tl);floatTxt(x,y-14,'+'+n);burst(x,y,r==='gem'?MN[id].c2:MN[id].c1,r==='gem'?8:4)}}
  });
  snd(got.some(g=>g[0]==='gem')?'rare':'spawn');
  if(s.tab==='work'){
    pulse($('minebar'));
    if(dup){const x=$('x2');x.classList.remove('go');void x.offsetWidth;x.classList.add('go');const[bx,by]=ctr($('prog'));burst(bx,by,'#ffe066',12)}
  }
  if(dup){snd('x2');vib(20)}
}

// ---- bucle y controles ----
$('craft').onclick=craft;
$('speed').onclick=()=>{s.speed=s.speed===1?5:1;$('speed').textContent='×'+s.speed;snd('click')};
$('mute').onclick=()=>{s.sound=!s.sound;$('mute').textContent=s.sound?'🔊':'🔇';snd('click')};
function showTab(t){
  s.tab=t;if(t==='book')s.newBook=false;
  document.querySelectorAll('.scene').forEach(x=>x.classList.toggle('on',x.id==='sc-'+t));
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x.dataset.sc===t));render();
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{snd('click');showTab(b.dataset.sc)});
setInterval(()=>{
  const dt=.2*s.speed,m=M();let ch=false;
  m.t+=dt;const iv=INT(m.lv.spd);
  for(let i=0;m.t>=iv&&i<6;i++){m.t-=iv;spawn();ch=true}
  if(m.t>=iv)m.t=0;
  MIDS.forEach(id=>{if(unlocked(id)&&m.lv['mini_'+id])miniTick(id,dt)});
  if(!m.job&&m.loop)startJob(m.loop,false);
  jobTick(dt);batchTick(dt);if(m.batch)ch=true;
  if(s.ring>0){s.ring-=dt;if(s.ring<=0){s.cust=makeCust();s.last='';ch=true;snd('rare')}}
  {const c=s.cust;if(c&&c.pat!=null){c.pat-=dt;if(!c.warn&&c.pat<c.pmax*.25){c.warn=1;toast('😠 '+c.p.name+' se impacienta')}
    if(c.pat<=0){if(c.type==='merchant'){s.last=c.p.name+' recoge su mercancía y se va.';endCust(1,0)}else{s.last=c.p.name+' se cansó de esperar.';repChange(-Math.round(rejPen(c)*.5));endCust(2,-1)}ch=true}}}
  if(ch&&!drag)render();else update();
},200);
let pb=null;
document.addEventListener('pointerdown',e=>{const b=e.target.closest('button');if(!b)return;pb={b,x:e.clientX,y:e.clientY};b.classList.add('pressed');startMusic();if(b.id==='craft')holdStart()});
const rel=(e,ok)=>{
  if(!pb)return;const{b,x,y}=pb;pb=null;b.classList.remove('pressed');holdStop();if(b.id==='craft'&&held){held=false;return}
  if(!ok||Math.hypot(e.clientX-x,e.clientY-y)>14)return;
  lastPt=[e.clientX,e.clientY];
  if(b.classList.contains('dis')){snd('bad');if(b.dataset.msg)toast(b.dataset.msg);b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');return}
  snd('click');vib(8);if(b.onclick)b.onclick({currentTarget:b});
};
document.addEventListener('pointerup',e=>rel(e,true));
document.addEventListener('pointercancel',e=>rel(e,false));
document.addEventListener('click',e=>{if(e.detail>0&&e.target.closest('button')){e.stopPropagation();e.preventDefault()}},true);
const SAVE='minergame.v1';let noSave=false;
function save(){
  if(noSave)return;
  try{const m=M(),o={v:1,coins:s.coins,sound:s.sound,tiers:s.tiers,envoy:s.envoy,mon:s.mon,minis:s.minis,served:s.served,people:s.people,recent:s.recent,disc:s.disc,book:s.book,made:s.made,bp:s.bp,rep:s.rep,tut:s.tut,tutG:s.tutG,sinceM:s.sinceM,seenEl:s.seenEl,mast:s.mast,seals:s.seals,runs:s.runs,music:s.music,ts:Date.now(),
    mine:{cells:m.cells,stock:m.stock,t:m.t,seen:m.seen,lv:m.lv,loop:m.loop,autoTier:m.autoTier,last:m.last,ghost:!!m.ghost,mini:Object.fromEntries(MIDS.map(id=>[id,{on:m.mini[id].on}]))}};
    localStorage.setItem(SAVE,JSON.stringify(o))}catch(e){}
}
function load(){
  try{
    const o=JSON.parse(localStorage.getItem(SAVE)||'null');if(!o||o.v!==1)return;
    ['coins','sound','tiers','envoy','mon','minis','served','people','recent','disc','book','made','bp','rep','tut','tutG','sinceM','seenEl','mast','seals','runs','music'].forEach(k=>{if(o[k]!==undefined)s[k]=o[k]});
    if(o.tut===undefined)s.tut=-1;
    const d=mk(),m=o.mine||{};
    s.mine=Object.assign(d,{cells:m.cells||d.cells,t:m.t||0,seen:m.seen||{},loop:m.loop||null,autoTier:m.autoTier||'mont',last:m.last||null,ghost:!!m.ghost});
    Object.assign(s.mine.stock,m.stock||{});Object.assign(s.mine.lv,m.lv||{});
    MIDS.forEach(id=>{if(m.mini&&m.mini[id])s.mine.mini[id].on=!!m.mini[id].on});
    $('mute').textContent=s.sound?'🔊':'🔇';$('music').classList.toggle('off',!s.music);
    const away=(Date.now()-(o.ts||Date.now()))/1000;if(away>90&&s.tut<0)setTimeout(()=>offline(Math.min(away,14400)),700);
  }catch(e){}
}
setInterval(save,5000);addEventListener('pagehide',save);document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
let rsT=0;$('reset').onclick=()=>{const n=Date.now();if(n-rsT<3000){noSave=true;try{localStorage.removeItem(SAVE)}catch(e){}location.reload()}else{rsT=n;toast('Toca otra vez para borrar la partida')}};
load();s.disp=s.coins;(function a(){s.disp+=(s.coins-s.disp)*.18;if(Math.abs(s.coins-s.disp)<.5)s.disp=s.coins;$('coins').textContent=fmt(Math.floor(s.disp));requestAnimationFrame(a)})();
buildUps();buildBook();showTab('sell');
</script>

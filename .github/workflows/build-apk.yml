name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx cap add android
      - name: Iconos y pantalla de carga
        run: npx capacitor-assets generate --android
      - name: Ajustes de Android (horizontal, pantalla completa, vibración)
        run: python3 tools/patch_android.py android
      - run: npx cap sync android
      - run: cd android && ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk the-miner-game.apk
      - uses: actions/upload-artifact@v4
        with:
          name: the-miner-game-apk
          path: the-miner-game.apk
      - name: Publicar en Releases (descargable desde el móvil)
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: ultima-build
          name: The Miner Game (última build)
          prerelease: true
          files: the-miner-game.apk
